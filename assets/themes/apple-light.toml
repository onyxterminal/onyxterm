[meta]
name = "apple-light"
version = "2"
kind = "light"

[surface]
canvas = "#FFFFFF"
subtle = "#F5F5F7"
raised = "#FFFFFF"
sunken = "#F5F5F7"

[text]
default = "#1D1D1F"
muted = "#6E6E73"
subtle = "#86868B"
inverse = "#FFFFFF"

[border]
default = "rgba(0,0,0,0.10)"
muted = "rgba(0,0,0,0.08)"
focus = "#007AFF"

[accent]
primary = "#007AFF"
primary_hover = "#0071EB"
primary_active = "#0062CC"

[status]
running = "#34C759"
exited = "#86868B"
failed = "#D70015"
stopping = "#FF9500"
starting = "#007AFF"
unknown = "#C7C7CC"
idle = "#C7C7CC"

[chrome]
control_fill = "rgba(0,0,0,0.05)"
icon_hover_fill = "rgba(0,0,0,0.06)"
menu_fill = "rgba(255,255,255,0.94)"
menu_border = "rgba(0,0,0,0.16)"
palette_fill = "rgba(255,255,255,0.96)"
selected_shortcut = "rgba(255,255,255,0.82)"
destructive = "#D70015"
backdrop = "rgba(0,0,0,0.18)"

[ui_font]
family = ".SystemUIFont"
tab_px = 12.0
button_px = 12.0
pane_title_px = 11.5
menu_px = 13.0
shortcut_px = 12.0
palette_input_px = 16.0
hint_px = 11.0
section_label_px = 11.0
dialog_title_px = 13.0
dialog_body_px = 12.0

[top_bar]
leading_gap_px = 10.0
control_height_px = 26.0
control_radius_px = 6.0
logo_px = 14.0
separator_width_px = 1.0
separator_height_px = 16.0
tab_padding_x_px = 14.0
tab_gap_px = 2.0
item_gap_px = 8.0

[pane_header]
padding_x_px = 10.0
status_dot_px = 6.0
icon_button_px = 20.0
icon_button_radius_px = 5.0
icon_px = 12.0

[editor]
gutter_text = "rgba(0,0,0,0.28)"
gutter_text_active = "rgba(0,0,0,0.72)"
current_line = "rgba(0,0,0,0.04)"
selection = "rgba(0,122,255,0.30)"
cursor = "#007AFF"
diff_added = "#248A3D"
diff_modified = "#007AFF"
gutter_padding_px = 12.0
cursor_width_px = 2.0

[syntax]
keyword = "#8032C9"
string = "#1A7F37"
number = "#B4530A"
type = "#946200"
function = "#0B62CC"
macro = "#127A82"
comment = "#737378"
punctuation = "#57606A"
heading = "#0B62CC"

[menu]
width_px = 240.0
radius_px = 10.0
padding_px = 5.0
border_px = 0.5
row_height_px = 26.0
row_radius_px = 5.0
row_padding_x_px = 9.0
offset_px = 4.0
section_label_height_px = 22.0

[palette]
width_px = 600.0
top_px = 72.0
radius_px = 12.0
border_px = 0.5
search_height_px = 48.0
search_icon_px = 18.0
row_height_px = 32.0
row_radius_px = 6.0
footer_height_px = 30.0
max_rows = 9

[dialog]
width_px = 360.0
radius_px = 12.0
button_height_px = 24.0
button_radius_px = 6.0

[island]
focus_ring_px = 1.0
unfocused_border_px = 0.5
dim_unfocused = true
unfocused_opacity = 0.82
pane_padding_x_px = 14.0
pane_padding_top_px = 6.0
pane_padding_bottom_px = 12.0

[[shadow.card]]
y = 1.0
blur = 3.0
color = "rgba(0,0,0,0.05)"

[[shadow.tab]]
spread = 0.5
color = "rgba(0,0,0,0.10)"

[[shadow.tab]]
y = 1.0
blur = 2.0
color = "rgba(0,0,0,0.06)"

[[shadow.menu]]
y = 12.0
blur = 32.0
color = "rgba(0,0,0,0.14)"

[[shadow.palette]]
y = 18.0
blur = 48.0
color = "rgba(0,0,0,0.18)"

[font]
family = "ui-monospace"
fallback = "SF Mono, Menlo, monospace"
size_px = 13
line_height = 1.4

[scrollback]
default_lines = 10000
max_lines = 100000

[ansi]
black = "#24292F"
red = "#CF222E"
green = "#1A7F37"
yellow = "#9A6700"
blue = "#0969DA"
magenta = "#8250DF"
cyan = "#1B7C83"
white = "#6E7781"
bright_black = "#57606A"
bright_red = "#A40E26"
bright_green = "#116329"
bright_yellow = "#7D4E00"
bright_blue = "#0969DA"
bright_magenta = "#6639BA"
bright_cyan = "#115F64"
bright_white = "#8C959F"

[input]
option_as_meta = true

[layout]
tab_strip_height_px = 38
pane_header_height_px = 26
border_radius_px = 6
gap_px = 1
island_radius_px = 10
island_gap_px = 6
window_margin_px = 6
min_pane_px = 120
animation_ms = 150
traffic_light_left_px = 14
traffic_light_top_px = 12
traffic_lights_width_px = 74
