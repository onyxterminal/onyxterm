[meta]
name = "apple-light"
version = "2"
kind = "light"

[surface]
window = "#ECECEF"
canvas = "#FFFFFF"
raised = "#FFFFFF"
sunken = "#F5F5F7"
settings_window = "#F2F2F4"

[text]
default = "#1D1D1F"
muted = "#6E6E73"
subtle = "#8A8A90"
on_accent = "#FFFFFF"

[border]
default = "rgba(0,0,0,0.11)"
muted = "rgba(0,0,0,0.07)"
focus = "rgba(0,122,255,0.5)"

[accent]
primary = "#007AFF"
primary_hover = "#0071EB"
primary_active = "#0062CC"
selection = "rgba(0,122,255,0.12)"

[status]
running = "#248A3D"
exited = "#86868B"
failed = "#D70015"
stopping = "#FF9500"
starting = "#007AFF"
unknown = "#C7C7CC"
idle = "#B4B4B9"

[chrome]
control_fill = "rgba(0,0,0,0.045)"
icon_hover_fill = "rgba(0,0,0,0.06)"
menu_fill = "rgba(255,255,255,0.985)"
destructive = "#D70015"
on_destructive = "#FFFFFF"
logo_ink = "#FFFFFF"
warning = "#A35200"
backdrop = "rgba(0,0,0,0.16)"

[ui_font]
family = ".SystemUIFont"
tab_px = 12.0
workspace_px = 12.5
button_px = 12.0
pane_title_px = 11.5
pill_px = 10.5
menu_px = 13.0
shortcut_px = 12.0
category_px = 11.5
palette_input_px = 16.0
hint_px = 11.0
section_label_px = 11.0
dialog_title_px = 13.0
dialog_body_px = 11.5

[top_bar]
leading_gap_px = 10.0
control_height_px = 26.0
control_radius_px = 6.0
logo_px = 15.0
separator_width_px = 1.0
separator_height_px = 16.0
tab_padding_left_px = 12.0
tab_padding_right_px = 26.0
tab_gap_px = 2.0
item_gap_px = 6.0

[pane_header]
padding_left_px = 12.0
padding_right_px = 6.0
status_dot_px = 7.0
icon_button_px = 22.0
icon_button_radius_px = 5.0
icon_px = 12.0
close_icon_px = 10.0

[editor]
gutter_text = "rgba(0,0,0,0.28)"
gutter_text_active = "rgba(0,0,0,0.72)"
current_line = "rgba(0,0,0,0.03)"
selection = "rgba(0,122,255,0.32)"
cursor = "#007AFF"
diff_added = "#2DA44E"
diff_modified = "#0969DA"
gutter_padding_px = 12.0
cursor_width_px = 2.0

[syntax]
keyword = "#8032C9"
string = "#1A7F37"
number = "#B4530A"
type = "#946200"
function = "#0B62CC"
macro = "#127A82"
comment = "#737378"
punctuation = "#6E6E73"
heading = "#0B62CC"

[menu]
width_px = 236.0
radius_px = 9.0
padding_px = 5.0
border_px = 1.0
row_height_px = 28.0
row_radius_px = 5.0
row_padding_x_px = 10.0
offset_px = 4.0
section_label_height_px = 25.0
popover_width_px = 320.0
popover_radius_px = 11.0
popover_padding_px = 6.0
popover_row_height_px = 40.0

[palette]
width_px = 620.0
top_px = 84.0
radius_px = 13.0
border_px = 1.0
search_height_px = 52.0
search_icon_px = 16.0
row_height_px = 34.0
row_radius_px = 7.0
footer_height_px = 34.0
list_max_height_px = 372.0

[dialog]
width_px = 272.0
radius_px = 14.0
button_height_px = 28.0
button_radius_px = 7.0
logo_px = 44.0

[island]
focus_ring_px = 1.0
unfocused_border_px = 0.5
dim_unfocused = true
unfocused_opacity = 0.8
pane_padding_x_px = 14.0
pane_padding_top_px = 0.0
pane_padding_bottom_px = 10.0

[[shadow.tab]]
spread = 0.5
color = "rgba(0,0,0,0.11)"

[[shadow.tab]]
y = 1.0
blur = 2.0
color = "rgba(0,0,0,0.08)"

[[shadow.menu]]
y = 14.0
blur = 40.0
color = "rgba(0,0,0,0.16)"

[[shadow.popover]]
y = 18.0
blur = 50.0
color = "rgba(0,0,0,0.16)"

[[shadow.hint]]
y = 6.0
blur = 20.0
color = "rgba(0,0,0,0.16)"

[[shadow.palette]]
y = 30.0
blur = 80.0
color = "rgba(0,0,0,0.16)"

[[shadow.toast]]
y = 10.0
blur = 30.0
color = "rgba(0,0,0,0.16)"

[font]
family = "Menlo"
fallback = "SF Mono, ui-monospace, monospace"
size_px = 13
line_height = 1.55

[scrollback]
default_lines = 10000
max_lines = 100000

[ansi]
black = "#24292F"
red = "#C4231C"
green = "#1A7F37"
yellow = "#946200"
blue = "#0B62CC"
magenta = "#8032C9"
cyan = "#127A82"
white = "#6E7781"
bright_black = "#57606A"
bright_red = "#A40E26"
bright_green = "#116329"
bright_yellow = "#7D4E00"
bright_blue = "#0969DA"
bright_magenta = "#6639BA"
bright_cyan = "#115F64"
bright_white = "#8C959F"

[input]
option_as_meta = true

[layout]
tab_strip_height_px = 40
pane_header_height_px = 30
border_radius_px = 6
gap_px = 1
island_radius_px = 10
island_gap_px = 6
window_margin_px = 8
min_pane_px = 120
animation_ms = 150
traffic_light_left_px = 14
traffic_light_top_px = 14
traffic_lights_width_px = 74
