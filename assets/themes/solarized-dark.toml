[meta]
name = "solarized-dark"
version = "2"
kind = "dark"

[surface]
window = "#00212B"
canvas = "#002B36"
raised = "#073642"
sunken = "#00242E"
settings_window = "#002B36"

[text]
default = "#EEE8D5"
muted = "#A9B9B4"
subtle = "#839496"
on_accent = "#00212A"

[border]
default = "rgba(147,161,161,0.24)"
muted = "rgba(147,161,161,0.20)"
focus = "rgba(105,184,236,0.5)"

[accent]
primary = "#69B8EC"
primary_hover = "#86CAFA"
primary_active = "#4C9FD8"
selection = "rgba(105,184,236,0.18)"

[status]
running = "#34C759"
exited = "#828996"
failed = "#FF453A"
stopping = "#FF9500"
starting = "#78AFFF"
unknown = "#C7C7CC"
idle = "#5A5A5F"

[chrome]
control_fill = "rgba(147,161,161,0.14)"
icon_hover_fill = "rgba(255,255,255,0.08)"
menu_fill = "rgba(7,54,66,0.98)"
destructive = "#FF6961"
on_destructive = "#2A0B0B"
logo_ink = "#00212B"
warning = "#FFB340"
backdrop = "rgba(0,0,0,0.42)"

[ui_font]
family = ".SystemUIFont"
tab_px = 12.0
workspace_px = 12.5
button_px = 12.0
pane_title_px = 11.5
pill_px = 10.5
menu_px = 13.0
shortcut_px = 12.0
category_px = 11.5
palette_input_px = 16.0
hint_px = 11.0
section_label_px = 11.0
dialog_title_px = 13.0
dialog_body_px = 11.5

[top_bar]
leading_gap_px = 10.0
control_height_px = 26.0
control_radius_px = 6.0
logo_px = 15.0
separator_width_px = 1.0
separator_height_px = 16.0
tab_padding_left_px = 12.0
tab_padding_right_px = 26.0
tab_gap_px = 2.0
item_gap_px = 6.0

[pane_header]
padding_left_px = 12.0
padding_right_px = 6.0
status_dot_px = 7.0
icon_button_px = 22.0
icon_button_radius_px = 5.0
icon_px = 12.0
close_icon_px = 10.0

[editor]
gutter_text = "rgba(255,255,255,0.24)"
gutter_text_active = "rgba(255,255,255,0.7)"
current_line = "rgba(255,255,255,0.035)"
selection = "rgba(105,184,236,0.32)"
cursor = "#69B8EC"
diff_added = "#859900"
diff_modified = "#268BD2"
gutter_padding_px = 12.0
cursor_width_px = 2.0

[syntax]
keyword = "#859900"
string = "#2AA198"
number = "#EB6CB2"
type = "#B58900"
function = "#65AFE0"
macro = "#F05B56"
comment = "#82969C"
punctuation = "#93A1A1"
heading = "#65AFE0"

[menu]
width_px = 236.0
radius_px = 9.0
padding_px = 5.0
border_px = 1.0
row_height_px = 28.0
row_radius_px = 5.0
row_padding_x_px = 10.0
offset_px = 4.0
section_label_height_px = 25.0
popover_width_px = 320.0
popover_radius_px = 11.0
popover_padding_px = 6.0
popover_row_height_px = 40.0

[palette]
width_px = 620.0
top_px = 84.0
radius_px = 13.0
border_px = 1.0
search_height_px = 52.0
search_icon_px = 16.0
row_height_px = 34.0
row_radius_px = 7.0
footer_height_px = 34.0
list_max_height_px = 372.0

[dialog]
width_px = 272.0
radius_px = 14.0
button_height_px = 28.0
button_radius_px = 7.0
logo_px = 44.0

[island]
focus_ring_px = 1.0
unfocused_border_px = 0.5
dim_unfocused = true
unfocused_opacity = 0.8
pane_padding_x_px = 14.0
pane_padding_top_px = 0.0
pane_padding_bottom_px = 10.0

[[shadow.tab]]
spread = 0.5
color = "rgba(147,161,161,0.24)"

[[shadow.tab]]
y = 1.0
blur = 2.0
color = "rgba(0,0,0,0.3)"

[[shadow.menu]]
y = 14.0
blur = 40.0
color = "rgba(0,0,0,0.55)"

[[shadow.popover]]
y = 18.0
blur = 50.0
color = "rgba(0,0,0,0.55)"

[[shadow.hint]]
y = 6.0
blur = 20.0
color = "rgba(0,0,0,0.55)"

[[shadow.palette]]
y = 30.0
blur = 80.0
color = "rgba(0,0,0,0.55)"

[font]
family = "Menlo"
fallback = "SF Mono, ui-monospace, monospace"
size_px = 13
line_height = 1.55

[scrollback]
default_lines = 10000
max_lines = 100000

[ansi]
black = "#073642"
red = "#DC322F"
green = "#859900"
yellow = "#B58900"
blue = "#268BD2"
magenta = "#D33682"
cyan = "#2AA198"
white = "#EEE8D5"
bright_black = "#586E75"
bright_red = "#F05B56"
bright_green = "#A8C027"
bright_yellow = "#D6B74B"
bright_blue = "#65AFE0"
bright_magenta = "#EB6CB2"
bright_cyan = "#65C8BC"
bright_white = "#FDF6E3"

[input]
option_as_meta = true

[layout]
tab_strip_height_px = 40
pane_header_height_px = 30
border_radius_px = 6
gap_px = 1
island_radius_px = 10
island_gap_px = 6
window_margin_px = 8
min_pane_px = 120
animation_ms = 150
traffic_light_left_px = 14
traffic_light_top_px = 14
traffic_lights_width_px = 74
