[meta]
name = "github-light"
version = "1"
kind = "light"

[surface]
canvas = "#FFFFFF"
subtle = "#F6F8FA"
raised = "#FFFFFF"
sunken = "#F6F8FA"

[text]
default = "#1F2328"
muted = "#656D76"
subtle = "#8C959F"
inverse = "#FFFFFF"

[border]
default = "#D1D9E0"
muted = "#D1D9E0B0"
focus = "#0969DA"

[accent]
primary = "#0969DA"
primary_hover = "#0860C7"
primary_active = "#0757B2"

[status]
running = "#1A7F37"
exited = "#656D76"
failed = "#CF222E"
stopping = "#9A6700"
starting = "#0969DA"
unknown = "#8C959F"

[font]
family = "ui-monospace"
fallback = "SF Mono, Menlo, monospace"
size_px = 13
line_height = 1.4

[scrollback]
default_lines = 10000
max_lines = 100000

[ansi]
black = "#24292F"
red = "#CF222E"
green = "#1A7F37"
yellow = "#9A6700"
blue = "#0969DA"
magenta = "#8250DF"
cyan = "#1B7C83"
white = "#6E7781"
bright_black = "#57606A"
bright_red = "#A40E26"
bright_green = "#116329"
bright_yellow = "#7D4E00"
bright_blue = "#0969DA"
bright_magenta = "#6639BA"
bright_cyan = "#115F64"
bright_white = "#8C959F"

[layout]
tab_strip_height_px = 36
workspace_rail_width_px = 200
pane_header_height_px = 28
border_radius_px = 6
gap_px = 1
island_radius_px = 10
island_gap_px = 6
window_margin_px = 8
island_padding_px = 8
