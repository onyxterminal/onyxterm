[meta]
name = "dracula"
version = "2"
kind = "dark"

[surface]
window = "#20212B"
canvas = "#282A36"
raised = "#343746"
sunken = "#222430"
settings_window = "#282A36"

[text]
default = "#F8F8F2"
muted = "#C9C9D2"
subtle = "#A1A2B0"
on_accent = "#1E1630"

[border]
default = "rgba(248,248,242,0.17)"
muted = "rgba(248,248,242,0.12)"
focus = "rgba(189,147,249,0.5)"

[accent]
primary = "#BD93F9"
primary_hover = "#D0B0FF"
primary_active = "#AA78EF"
selection = "rgba(189,147,249,0.18)"

[status]
running = "#34C759"
exited = "#828996"
failed = "#FF453A"
stopping = "#FF9500"
starting = "#78AFFF"
unknown = "#C7C7CC"
idle = "#5A5A5F"

[chrome]
control_fill = "rgba(248,248,242,0.08)"
icon_hover_fill = "rgba(255,255,255,0.08)"
menu_fill = "rgba(52,55,70,0.98)"
destructive = "#FF6961"
on_destructive = "#2A0B0B"
logo_ink = "#20212B"
warning = "#FFB340"
backdrop = "rgba(0,0,0,0.42)"

[ui_font]
family = ".SystemUIFont"
tab_px = 12.0
workspace_px = 12.5
button_px = 12.0
pane_title_px = 11.5
pill_px = 10.5
menu_px = 13.0
shortcut_px = 12.0
category_px = 11.5
palette_input_px = 16.0
hint_px = 11.0
section_label_px = 11.0
dialog_title_px = 13.0
dialog_body_px = 11.5

[top_bar]
leading_gap_px = 10.0
control_height_px = 26.0
control_radius_px = 6.0
logo_px = 15.0
separator_width_px = 1.0
separator_height_px = 16.0
tab_padding_left_px = 12.0
tab_padding_right_px = 26.0
tab_gap_px = 2.0
item_gap_px = 6.0

[pane_header]
padding_left_px = 12.0
padding_right_px = 6.0
status_dot_px = 7.0
icon_button_px = 22.0
icon_button_radius_px = 5.0
icon_px = 12.0
close_icon_px = 10.0

[editor]
gutter_text = "rgba(255,255,255,0.24)"
gutter_text_active = "rgba(255,255,255,0.7)"
current_line = "rgba(255,255,255,0.035)"
selection = "rgba(189,147,249,0.32)"
cursor = "#BD93F9"
diff_added = "#50FA7B"
diff_modified = "#8BE9FD"
gutter_padding_px = 12.0
cursor_width_px = 2.0

[syntax]
keyword = "#FF79C6"
string = "#F1FA8C"
number = "#BD93F9"
type = "#8BE9FD"
function = "#50FA7B"
macro = "#FFB86C"
comment = "#8A95C8"
punctuation = "#C9C9D2"
heading = "#BD93F9"

[menu]
width_px = 236.0
radius_px = 9.0
padding_px = 5.0
border_px = 1.0
row_height_px = 28.0
row_radius_px = 5.0
row_padding_x_px = 10.0
offset_px = 4.0
section_label_height_px = 25.0
popover_width_px = 320.0
popover_radius_px = 11.0
popover_padding_px = 6.0
popover_row_height_px = 40.0

[palette]
width_px = 620.0
top_px = 84.0
radius_px = 13.0
border_px = 1.0
search_height_px = 52.0
search_icon_px = 16.0
row_height_px = 34.0
row_radius_px = 7.0
footer_height_px = 34.0
list_max_height_px = 372.0

[dialog]
width_px = 272.0
radius_px = 14.0
button_height_px = 28.0
button_radius_px = 7.0
logo_px = 44.0

[island]
focus_ring_px = 1.0
unfocused_border_px = 0.5
dim_unfocused = true
unfocused_opacity = 0.8
pane_padding_x_px = 14.0
pane_padding_top_px = 0.0
pane_padding_bottom_px = 10.0

[[shadow.tab]]
spread = 0.5
color = "rgba(248,248,242,0.17)"

[[shadow.tab]]
y = 1.0
blur = 2.0
color = "rgba(0,0,0,0.3)"

[[shadow.menu]]
y = 14.0
blur = 40.0
color = "rgba(0,0,0,0.55)"

[[shadow.popover]]
y = 18.0
blur = 50.0
color = "rgba(0,0,0,0.55)"

[[shadow.hint]]
y = 6.0
blur = 20.0
color = "rgba(0,0,0,0.55)"

[[shadow.palette]]
y = 30.0
blur = 80.0
color = "rgba(0,0,0,0.55)"

[[shadow.toast]]
y = 10.0
blur = 30.0
color = "rgba(0,0,0,0.55)"

[font]
family = "Menlo"
fallback = "SF Mono, ui-monospace, monospace"
size_px = 13
line_height = 1.55

[scrollback]
default_lines = 10000
max_lines = 100000

[ansi]
black = "#44475A"
red = "#FF5555"
green = "#50FA7B"
yellow = "#F1FA8C"
blue = "#8BE9FD"
magenta = "#BD93F9"
cyan = "#8BE9FD"
white = "#F8F8F2"
bright_black = "#6272A4"
bright_red = "#FF7979"
bright_green = "#74FF9B"
bright_yellow = "#FFFFA5"
bright_blue = "#A9F1FF"
bright_magenta = "#D2B0FF"
bright_cyan = "#A9F1FF"
bright_white = "#FFFFFF"

[input]
option_as_meta = true

[layout]
tab_strip_height_px = 40
pane_header_height_px = 30
border_radius_px = 6
gap_px = 1
island_radius_px = 10
island_gap_px = 6
window_margin_px = 8
min_pane_px = 120
animation_ms = 150
traffic_light_left_px = 14
traffic_light_top_px = 14
traffic_lights_width_px = 74
