[meta]
name = "nord"
version = "2"
kind = "dark"

[surface]
window = "#242933"
canvas = "#2E3440"
raised = "#3B4252"
sunken = "#272C36"
settings_window = "#2E3440"

[text]
default = "#ECEFF4"
muted = "#C2CAD6"
subtle = "#9DA9BA"
on_accent = "#14202A"

[border]
default = "rgba(236,239,244,0.18)"
muted = "rgba(236,239,244,0.12)"
focus = "rgba(136,192,208,0.5)"

[accent]
primary = "#88C0D0"
primary_hover = "#9FD0DF"
primary_active = "#70AABA"
selection = "rgba(136,192,208,0.18)"

[status]
running = "#34C759"
exited = "#828996"
failed = "#FF453A"
stopping = "#FF9500"
starting = "#78AFFF"
unknown = "#C7C7CC"
idle = "#5A5A5F"

[chrome]
control_fill = "rgba(236,239,244,0.08)"
icon_hover_fill = "rgba(255,255,255,0.08)"
menu_fill = "rgba(59,66,82,0.98)"
destructive = "#FF6961"
on_destructive = "#2A0B0B"
logo_ink = "#242933"
warning = "#FFB340"
backdrop = "rgba(0,0,0,0.42)"

[ui_font]
family = ".SystemUIFont"
tab_px = 12.0
workspace_px = 12.5
button_px = 12.0
pane_title_px = 11.5
pill_px = 10.5
menu_px = 13.0
shortcut_px = 12.0
category_px = 11.5
palette_input_px = 16.0
hint_px = 11.0
section_label_px = 11.0
dialog_title_px = 13.0
dialog_body_px = 11.5

[top_bar]
