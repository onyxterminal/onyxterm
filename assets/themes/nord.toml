control_height_px = 26.0
control_radius_px = 6.0
logo_px = 15.0
separator_width_px = 1.0
separator_height_px = 16.0
tab_padding_left_px = 12.0
tab_padding_right_px = 26.0
tab_gap_px = 2.0
item_gap_px = 6.0

[pane_header]
padding_left_px = 12.0
padding_right_px = 6.0
status_dot_px = 7.0
icon_button_px = 22.0
icon_button_radius_px = 5.0
icon_px = 12.0
close_icon_px = 10.0

[editor]
gutter_text = "rgba(255,255,255,0.24)"
gutter_text_active = "rgba(255,255,255,0.7)"
current_line = "rgba(255,255,255,0.035)"
selection = "rgba(136,192,208,0.32)"
cursor = "#88C0D0"
diff_added = "#A3BE8C"
diff_modified = "#81A1C1"
gutter_padding_px = 12.0
cursor_width_px = 2.0

[syntax]
keyword = "#88A6C6"
string = "#A3BE8C"
number = "#C3A3BD"
type = "#8FBCBB"
function = "#88C0D0"
macro = "#DA9580"
comment = "#939EB3"
punctuation = "#C2CAD6"
heading = "#88C0D0"

[menu]
width_px = 236.0
radius_px = 9.0
padding_px = 5.0
border_px = 1.0
row_height_px = 28.0
