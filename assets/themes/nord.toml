row_padding_x_px = 10.0
offset_px = 4.0
section_label_height_px = 25.0
popover_width_px = 320.0
popover_radius_px = 11.0
popover_padding_px = 6.0
popover_row_height_px = 40.0

[palette]
width_px = 620.0
top_px = 84.0
radius_px = 13.0
border_px = 1.0
search_height_px = 52.0
search_icon_px = 16.0
row_height_px = 34.0
row_radius_px = 7.0
footer_height_px = 34.0
list_max_height_px = 372.0

[dialog]
width_px = 272.0
radius_px = 14.0
button_height_px = 28.0
button_radius_px = 7.0
logo_px = 44.0

[island]
focus_ring_px = 1.0
unfocused_border_px = 0.5
dim_unfocused = true
unfocused_opacity = 0.8
pane_padding_x_px = 14.0
pane_padding_top_px = 0.0
pane_padding_bottom_px = 10.0

[[shadow.tab]]
spread = 0.5
color = "rgba(236,239,244,0.18)"

[[shadow.tab]]
y = 1.0
blur = 2.0
color = "rgba(0,0,0,0.3)"

[[shadow.menu]]
y = 14.0
blur = 40.0
color = "rgba(0,0,0,0.55)"

[[shadow.popover]]
y = 18.0
blur = 50.0
color = "rgba(0,0,0,0.55)"

[[shadow.hint]]
y = 6.0
blur = 20.0
color = "rgba(0,0,0,0.55)"

[[shadow.palette]]
y = 30.0
blur = 80.0
color = "rgba(0,0,0,0.55)"

[font]
family = "Menlo"
fallback = "SF Mono, ui-monospace, monospace"
size_px = 13
line_height = 1.55

[scrollback]
default_lines = 10000
max_lines = 100000

[ansi]
black = "#3B4252"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#88C0D0"
white = "#D8DEE9"
bright_black = "#6B7688"
bright_red = "#D08770"
bright_green = "#B4D49B"
bright_yellow = "#F3D99F"
bright_blue = "#9EC1E1"
bright_magenta = "#CBA8C5"
bright_cyan = "#A5D9E5"
bright_white = "#ECEFF4"

[input]
option_as_meta = true

[layout]
tab_strip_height_px = 40
pane_header_height_px = 30
border_radius_px = 6
gap_px = 1
island_radius_px = 10
island_gap_px = 6
window_margin_px = 8
min_pane_px = 120
animation_ms = 150
traffic_light_left_px = 14
traffic_light_top_px = 14
traffic_lights_width_px = 74
