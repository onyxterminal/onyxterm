[meta]
name = "onyx-dark"
version = "2"
kind = "dark"

[surface]
canvas = "#202022"
subtle = "#18181A"
raised = "#2C2C2E"
sunken = "#18181A"

[text]
default = "#EDEFF2"
muted = "#A4AAB5"
subtle = "#828996"
inverse = "#111318"

[border]
default = "rgba(255,255,255,0.13)"
muted = "rgba(255,255,255,0.09)"
focus = "#78AFFF"

[accent]
primary = "#78AFFF"
primary_hover = "#94BFFF"
primary_active = "#5B9CFA"

[status]
running = "#34C759"
exited = "#828996"
failed = "#D70015"
stopping = "#FF9500"
starting = "#78AFFF"
unknown = "#C7C7CC"
idle = "#636366"

[chrome]
control_fill = "rgba(255,255,255,0.07)"
icon_hover_fill = "rgba(255,255,255,0.08)"
menu_fill = "rgba(39,42,48,0.98)"
menu_border = "rgba(255,255,255,0.18)"
palette_fill = "rgba(39,42,48,0.98)"
selected_shortcut = "rgba(255,255,255,0.82)"
destructive = "#D70015"
backdrop = "rgba(0,0,0,0.48)"

[ui_font]
family = ".SystemUIFont"
tab_px = 12.0
button_px = 12.0
pane_title_px = 11.5
menu_px = 13.0
shortcut_px = 12.0
palette_input_px = 16.0
hint_px = 11.0
section_label_px = 11.0
dialog_title_px = 13.0
dialog_body_px = 12.0

[top_bar]
leading_gap_px = 10.0
control_height_px = 26.0
control_radius_px = 6.0
logo_px = 14.0
separator_width_px = 1.0
separator_height_px = 16.0
tab_padding_x_px = 14.0
tab_gap_px = 2.0
item_gap_px = 8.0

[pane_header]
padding_x_px = 10.0
status_dot_px = 6.0
icon_button_px = 20.0
icon_button_radius_px = 5.0
icon_px = 12.0

[editor]
gutter_text = "rgba(255,255,255,0.28)"
gutter_text_active = "rgba(255,255,255,0.72)"
current_line = "rgba(255,255,255,0.04)"
selection = "rgba(120,175,255,0.30)"
cursor = "#78AFFF"
diff_added = "#30D158"
diff_modified = "#78AFFF"
gutter_padding_px = 12.0
cursor_width_px = 2.0

[syntax]
keyword = "#C5A1FF"
string = "#76D79A"
number = "#FFB37A"
type = "#F2C878"
function = "#81B7FF"
macro = "#74D6DC"
comment = "#868C98"
punctuation = "#A4AAB5"
heading = "#81B7FF"

[menu]
width_px = 240.0
radius_px = 10.0
padding_px = 5.0
border_px = 0.5
row_height_px = 26.0
row_radius_px = 5.0
row_padding_x_px = 9.0
offset_px = 4.0
section_label_height_px = 22.0

[palette]
width_px = 600.0
top_px = 72.0
radius_px = 12.0
border_px = 0.5
search_height_px = 48.0
search_icon_px = 18.0
row_height_px = 32.0
row_radius_px = 6.0
footer_height_px = 30.0
max_rows = 9

[dialog]
width_px = 360.0
radius_px = 12.0
button_height_px = 24.0
button_radius_px = 6.0

[island]
focus_ring_px = 1.0
unfocused_border_px = 0.5
dim_unfocused = true
unfocused_opacity = 0.82
pane_padding_x_px = 14.0
pane_padding_top_px = 6.0
pane_padding_bottom_px = 12.0

[[shadow.card]]
y = 1.0
blur = 3.0
color = "rgba(0,0,0,0.18)"

[[shadow.tab]]
spread = 0.5
color = "rgba(255,255,255,0.13)"

[[shadow.tab]]
y = 1.0
blur = 2.0
color = "rgba(0,0,0,0.18)"

[[shadow.menu]]
y = 12.0
blur = 32.0
color = "rgba(0,0,0,0.14)"

[[shadow.palette]]
y = 18.0
blur = 48.0
color = "rgba(0,0,0,0.48)"

[font]
family = "ui-monospace"
fallback = "SF Mono, Menlo, monospace"
size_px = 13
line_height = 1.4

[scrollback]
default_lines = 10000
max_lines = 100000

[ansi]
black = "#3C424D"
red = "#FF7B86"
green = "#76D79A"
yellow = "#F2C878"
blue = "#81B7FF"
magenta = "#C5A1FF"
cyan = "#74D6DC"
white = "#D9DEE6"
bright_black = "#828C9B"
bright_red = "#FFA4AD"
bright_green = "#A0E8B8"
bright_yellow = "#FFE0A0"
bright_blue = "#ACD0FF"
bright_magenta = "#DCC4FF"
bright_cyan = "#A2EAF0"
bright_white = "#FFFFFF"

[input]
option_as_meta = true

[layout]
tab_strip_height_px = 38
pane_header_height_px = 26
border_radius_px = 6
gap_px = 1
island_radius_px = 10
island_gap_px = 6
window_margin_px = 6
min_pane_px = 120
animation_ms = 150
traffic_light_left_px = 14
traffic_light_top_px = 12
traffic_lights_width_px = 74
