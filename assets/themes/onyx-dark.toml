popover_padding_px = 6.0
popover_row_height_px = 40.0

[palette]
width_px = 620.0
top_px = 84.0
radius_px = 13.0
border_px = 1.0
search_height_px = 52.0
search_icon_px = 16.0
row_height_px = 34.0
row_radius_px = 7.0
footer_height_px = 34.0
list_max_height_px = 372.0

[dialog]
width_px = 272.0
radius_px = 14.0
button_height_px = 28.0
button_radius_px = 7.0
logo_px = 44.0

[island]
focus_ring_px = 1.0
unfocused_border_px = 0.5
dim_unfocused = true
unfocused_opacity = 0.8
pane_padding_x_px = 14.0
pane_padding_top_px = 0.0
pane_padding_bottom_px = 10.0

[[shadow.tab]]
spread = 0.5
color = "rgba(255,255,255,0.12)"

[[shadow.tab]]
y = 1.0
blur = 2.0
color = "rgba(0,0,0,0.3)"

[[shadow.menu]]
y = 14.0
blur = 40.0
color = "rgba(0,0,0,0.55)"

[[shadow.popover]]
y = 18.0
blur = 50.0
color = "rgba(0,0,0,0.55)"

[[shadow.hint]]
y = 6.0
blur = 20.0
color = "rgba(0,0,0,0.55)"

[[shadow.palette]]
y = 30.0
blur = 80.0
color = "rgba(0,0,0,0.55)"

[[shadow.toast]]
y = 10.0
blur = 30.0
color = "rgba(0,0,0,0.55)"

[[shadow.find]]
y = 8.0
blur = 24.0
color = "rgba(0,0,0,0.55)"

[font]
family = "Menlo"
fallback = "SF Mono, ui-monospace, monospace"
size_px = 13
line_height = 1.55

[scrollback]
default_lines = 10000
max_lines = 100000

[ansi]
black = "#3C424D"
red = "#FF7B86"
green = "#76D79A"
yellow = "#F2C878"
blue = "#81B7FF"
magenta = "#C5A1FF"
cyan = "#74D6DC"
white = "#D9DEE6"
bright_black = "#828C9B"
bright_red = "#FFA4AD"
bright_green = "#A0E8B8"
bright_yellow = "#FFE0A0"
bright_blue = "#ACD0FF"
bright_magenta = "#DCC4FF"
bright_cyan = "#A2EAF0"
bright_white = "#FFFFFF"

[input]
option_as_meta = true

[layout]
tab_strip_height_px = 40
pane_header_height_px = 30
border_radius_px = 6
gap_px = 1
island_radius_px = 10
island_gap_px = 6
window_margin_px = 8
min_pane_px = 120
animation_ms = 150
traffic_light_left_px = 14
traffic_light_top_px = 14
traffic_lights_width_px = 74
