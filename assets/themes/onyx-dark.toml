[meta]
name = "onyx-dark"
version = "2"
kind = "dark"

[surface]
window = "#151517"
canvas = "#1E1E20"
raised = "#2C2C2E"
sunken = "#18181A"
settings_window = "#232325"

[text]
default = "#E8EAEE"
muted = "#A4AAB5"
subtle = "#7D838F"
on_accent = "#0B1424"

[border]
default = "rgba(255,255,255,0.12)"
muted = "rgba(255,255,255,0.07)"
focus = "rgba(120,175,255,0.5)"

[accent]
primary = "#78AFFF"
primary_hover = "#94BFFF"
primary_active = "#5B9CFA"
selection = "rgba(120,175,255,0.18)"

[status]
running = "#34C759"
exited = "#828996"
failed = "#FF453A"
stopping = "#FF9500"
starting = "#78AFFF"
unknown = "#C7C7CC"
idle = "#5A5A5F"

[chrome]
control_fill = "rgba(255,255,255,0.06)"
icon_hover_fill = "rgba(255,255,255,0.08)"
menu_fill = "rgba(38,40,45,0.985)"
destructive = "#FF6961"
on_destructive = "#2A0B0B"
logo_ink = "#151517"
warning = "#FFB340"
backdrop = "rgba(0,0,0,0.42)"

[ui_font]
family = ".SystemUIFont"
tab_px = 12.0
workspace_px = 12.5
button_px = 12.0
pane_title_px = 11.5
pill_px = 10.5
menu_px = 13.0
shortcut_px = 12.0
category_px = 11.5
palette_input_px = 16.0
hint_px = 11.0
section_label_px = 11.0
dialog_title_px = 13.0
dialog_body_px = 11.5

[top_bar]
leading_gap_px = 10.0
control_height_px = 26.0
control_radius_px = 6.0
logo_px = 15.0
separator_width_px = 1.0
separator_height_px = 16.0
tab_padding_left_px = 12.0
tab_padding_right_px = 26.0
tab_gap_px = 2.0
item_gap_px = 6.0

[pane_header]
padding_left_px = 12.0
padding_right_px = 6.0
status_dot_px = 7.0
icon_button_px = 22.0
icon_button_radius_px = 5.0
icon_px = 12.0
close_icon_px = 10.0

[editor]
gutter_text = "rgba(255,255,255,0.24)"
gutter_text_active = "rgba(255,255,255,0.7)"
current_line = "rgba(255,255,255,0.035)"
selection = "rgba(120,175,255,0.32)"
cursor = "#78AFFF"
diff_added = "#4FB86E"
diff_modified = "#5B9CFA"
gutter_padding_px = 12.0
gutter_padding_right_px = 14.0
cursor_width_px = 2.0

[find]
hit = "rgba(242,200,120,0.28)"
hit_current = "rgba(242,200,120,0.7)"
