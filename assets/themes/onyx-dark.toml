type = "#F2C878"
function = "#81B7FF"
macro = "#74D6DC"
comment = "#7D838F"
punctuation = "#A4AAB5"
heading = "#81B7FF"

[menu]
width_px = 236.0
radius_px = 9.0
padding_px = 5.0
border_px = 1.0
row_height_px = 28.0
row_radius_px = 5.0
row_padding_x_px = 10.0
offset_px = 4.0
section_label_height_px = 25.0
popover_width_px = 320.0
