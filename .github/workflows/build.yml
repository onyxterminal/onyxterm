# Required secrets to enable Developer ID signing and notarization:
#   APPLE_SIGNING_IDENTITY    e.g. "Developer ID Application: Onyx (TEAMID)"
#   APPLE_TEAM_ID             10-character Apple team identifier
#   APPLE_CERT_P12_BASE64     base64 of the Developer ID Application .p12
#   APPLE_CERT_PASSWORD       password for the .p12 above
#   APPLE_KEYCHAIN_PROFILE    notarytool keychain profile, seeded once per runner
# The signing block below stays inert until APPLE_SIGNING_IDENTITY is set.

name: Build
run-name: "build ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: Onyx
  APP_NAME: Onyx
  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
  APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
  APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}

jobs:
  build:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --bin app -p app

      - name: Regenerate .icns
        run: scripts/make-icon.sh

      - name: Bundle .app
        run: scripts/bundle-macos.sh

      ## ENABLED: when you have an Apple Developer ID, set the five
      ## APPLE_* secrets and remove this comment block header.
      ## The block stays inert until APPLE_SIGNING_IDENTITY is non-empty.
      - name: Import Developer ID certificate
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ env.APPLE_CERT_PASSWORD }}

      ## ENABLED: when you have a Developer ID, also create
      ## packaging/Entitlements.plist and add --entitlements to the
      ## two codesign lines below.
      - name: Re-sign .app with Developer ID
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          BUNDLE="target/release/${{ env.APP_NAME }}.app"
          codesign --force --options runtime --timestamp \
            --sign "${{ env.APPLE_SIGNING_IDENTITY }}" \
            "$BUNDLE/Contents/MacOS/${{ env.APP_NAME }}"
          codesign --force --options runtime --timestamp \
            --sign "${{ env.APPLE_SIGNING_IDENTITY }}" \
            "$BUNDLE"
          codesign --verify --verbose=2 "$BUNDLE"

      - name: Notarize .app
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          xcrun notarytool submit "target/release/${{ env.APP_NAME }}.app" \
            --keychain-profile "${{ env.APPLE_KEYCHAIN_PROFILE }}" --wait

      - name: Staple .app
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: xcrun stapler staple "target/release/${{ env.APP_NAME }}.app"

      - name: Gatekeeper accept .app
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: spctl -a -t exec --verbose=2 "target/release/${{ env.APP_NAME }}.app"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .dmg
        working-directory: target/release
        run: |
          rm -rf staging
          mkdir staging
          cp -R "${{ env.APP_NAME }}.app" staging/
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --volicon "$GITHUB_WORKSPACE/assets/icons/${{ env.APP_NAME }}.icns" \
            --background "$GITHUB_WORKSPACE/packaging/dmg/background.png" \
            --window-pos 200 120 \
            --window-size 540 360 \
            --icon-size 100 \
            --icon "${{ env.APP_NAME }}.app" 150 180 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 390 180 \
            --overwrite \
            "${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg" \
            staging
          rm -rf staging
        shell: bash

      - name: Staple .dmg
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        working-directory: target/release
        run: xcrun stapler staple "${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-macos-arm64
          path: target/release/Onyx-*.dmg

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/onyx-macos-arm64/*.dmg
