name: Build
run-name: "build ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: Onyx
  APP_NAME: Onyx

jobs:
  build:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --bin app -p app

      - name: Regenerate .icns
        run: scripts/make-icon.sh

      - name: Bundle .app
        run: scripts/bundle-macos.sh

      - name: Build .dmg
        run: |
          cd target/release
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder "${{ env.APP_NAME }}.app" \
            -ov -format UDZO \
            "${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg"
        shell: bash

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-macos-arm64
          path: target/release/Onyx-*.dmg

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/onyx-macos-arm64/*.dmg
